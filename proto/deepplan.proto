syntax = "proto2";

enum DataType {
    TYPE_FP32 = 1;
    TYPE_INT32 = 2;
    TYPE_INT64 = 3;
}

message ModelInput {
    required DataType data_type = 1;
    repeated uint32 shape = 2;
    optional uint32 max_number = 3;
}

message Plan {
    enum PlanType {
        NAIVE = 1;
        STATIC = 2;
        DYNAMIC = 3;
    }

    required PlanType plan_type = 1;
    repeated uint32 load_layers = 2;
}

message Prof {
    enum EngineType {
        PIPESWITCH = 1;
        DEEPPLAN = 2;
    }

    message ExecTime {
        required uint32 batch_size = 1;
        required double exec_ns  = 2;
    }

    message OptimalPoint {
        required uint32 batch_size = 1;
        required uint32 layer_idx = 2;
        required uint32 load_size = 3;
    }

    required EngineType engine_type = 1;
    repeated ExecTime exec_times = 2;
    repeated OptimalPoint optimal_points = 3;
    repeated double layer_load_times = 4;
    repeated uint32 layer_sizes = 5;
}

message ModelConfig {
    required string model_name = 1;
    repeated ModelInput inputs = 2;
    repeated Plan plans = 3;
    repeated Prof profs = 4;
    required uint32 slo = 5;
    required uint32 max_batch_size = 6;
}

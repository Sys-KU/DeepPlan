syntax = "proto2";

enum MsgType {
    REQ_INFERENCE    = 1;
    REQ_UPLOAD_MODEL = 2;
    REQ_LS           = 3;
    REQ_CLOSE        = 4;

    RSP_INFERENCE    = 101;
    RSP_UPLOAD_MODEL = 102;
    RSP_LS           = 103;
    RSP_CLOSE        = 104;
    RSP_TIMEOUT      = 105;
}

message InferenceReqProto {
    required uint32 req_id = 1;
    required uint32 model_id = 2;
    required uint32 batch_size = 3;
    required uint32 disable_timeout = 4;
}

message InferenceRspProto {
    required uint32 req_id = 1;
    required int32 cold_type = 2;
    required double infer_time = 3;
    required uint64 arrival_time = 4;
    required uint64 response_time = 5;
    required uint64 deadline = 6;
}

message UploadModelReqProto {
    required uint32 req_id = 1;
    repeated string model_names = 2;
    required uint32 n_models = 3;
    required uint32 engine_type = 4;
    required uint32 r_policy = 5;
    required uint32 mp_size = 6;
    required bool disable_prefetch = 7;
}

message UploadModelRspProto {
    required uint32 req_id = 1;
}

message CloseReqProto {
    required uint32 req_id = 1;
}

message CloseRspProto {
    required uint32 req_id = 1;
}

message TimeoutRspProto {
    required uint32 req_id = 1;
}
